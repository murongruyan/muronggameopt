# 6.11 官方环境复刻配置（module/vtools/official_env.sh 读取）
# enabled=0 可整体关闭
enabled=1
# 逗号分隔；只禁用"已安装但未禁用"的包
disable_packages=com.oplus.ohome,com.oplus.customize.coreapp
# OIFace（持久属性置 0 + stop oiface）
oiface_disable=1
# game_opt：解除官方游戏调频限制
game_opt_disable_limit=1
# game_opt debug_enable（留空不改）
game_opt_debug=0
