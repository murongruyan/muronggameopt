# DDR 上限按 GPU 当前频率动态压制（task-38）
# 文件缺失或选项缺失时使用代码内置默认值（enabled=1）。
#
# 规则：
#   GPU ≤ gpu_low_mhz  → DDR 上限 = ddr_low_mts
#   GPU ≥ gpu_high_mhz → DDR 上限 = ddr_high_mts
#   中间按 GPU 频率线性插值
#   MT/s → DDR 节点 kHz = MT/s × 1000 / 2，再吸附到 available_frequencies 中
#   不超过结果的最高档（9569→4784500→4780000；6389→3194500→3187000）
# 上限写入所有 DDR max_freq 节点，并防平台改写；GPU 频率节点不存在/读不到时不启用。
#
# 关闭：enabled=0（运行中最迟 5 秒生效，并恢复原上限）
enabled=1
gpu_low_mhz=300
gpu_high_mhz=400
ddr_low_mts=6389
ddr_high_mts=9569
