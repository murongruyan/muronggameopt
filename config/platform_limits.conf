# 平台限制管理配置（WALT smart_freq / WALT freq cap / msm_performance）
# 读取方：bin/activity_platform_limits.inc（platform_limits_init/tick）
# 节点语义已由 GitHub 一加开源 6.12 内核源码确认，详见 _module_scan/kernel_notes.md §6/§7
#   device: OnePlusOSS/android_kernel_oneplus_sm8850 @ fc30e541 (oneplus/sm8850_b_16.0.0_oneplus_15)
#   common: OnePlusOSS/android_kernel_common_oneplus_sm8850 @ d9053b90（纯 GKI，无 WALT）
# 值单位：除 msm_cpu_max_freq 外均为 kHz；2147483647 = INT_MAX = 不限制
# 语法：key=value，# 开头为注释；未知键忽略；
# 文件不存在时全部使用代码内置默认值（enabled=1，IPC 自动取第 3 档，cap 不限制，msm 只记录基线）。

enabled=1

# ── IPC 频率档位上限：/proc/sys/walt/clusterN/smart_freq/ipc_freq_levels ──
# 源码语义（kernel/sched/walt/smart_freq.c:257-329, cpufreq_walt.c:253-292）：
#   5 个「IPC 档位 → 允许频率上限(kHz)」，数组必须非递减（kernel 用 -EINVAL 拒绝减小）；
#   本模块只做「超过上限的元素压到上限」，结果仍非递减；压高位档=降低高 IPC 时频率上限→省电。
# >0：固定上限（kHz 值最好取该簇 scaling_available_frequencies 中的真实频点）；
# 0：自动取当前数组第 3 档（保守值，真机 cluster0=2745600 / cluster1=3859200）；
# -1：不限制该簇
ipc_limit_cluster0=0
ipc_limit_cluster1=0

# ── 日常（非游戏）WALT 频率上限 ──
# sched_high_perf_cluster_freq_cap：每 sched cluster 一个 int（真机 2 个）。
#   源码确认（walt.c:4827-4877）：仅在 plenty_giant_tasks 状态时套用 high_perf_cluster_freq_cap，
#   10s 迟滞复位；而当前开源版本 plenty_giant_tasks 从未被赋值 → 该节点实际不生效。
#   → 保持 INT_MAX（写了也不生效，不要用它承载日常限频）。
# sched_max_freq_partial_halt：1 个 int。
#   源码确认（walt_halt.c:283-305, walt.h:1399-1408）：仅在 is_state1（可暂停 CPU 全部被
#   halt/partial-halt）窗口内作为簇频率上限；日常不生效。保持 INT_MAX；实验可试 1500000~2000000。
daily_sched_high_perf_cluster_freq_cap=2147483647
daily_sched_max_freq_partial_halt=2147483647

# ── 游戏时恢复值（一般保持不限制）──
game_sched_high_perf_cluster_freq_cap=2147483647
game_sched_max_freq_partial_halt=2147483647

# ── msm_performance cpu_max_freq：/sys/kernel/msm_performance/parameters/cpu_max_freq ──
# 源码语义（drivers/soc/qcom/msm_performance.c:99-100/353-429）：该驱动自己的 per-CPU
# FREQ_QOS_MAX 请求；最终频率上限 = 所有 QoS 请求的最小值，因此向上写只能放松本驱动约束，
# 不能突破 thermal/其它请求；向下写会真实压低。
# 0=只记录基线、不写（默认，避免和平台/热管理抢控制）；
# 1=游戏中只做「不低于当前值」的抬高（raise-only），绝不压低
msm_cpu_max_freq_enable=0
# "cpu:khz" 对，空格分隔；enable=1 时才生效，留空=不写。
# 真机开机基线示例：0:3628800 1:3628800 2:3628800 3:3628800 4:4608000 5:4608000 6:4608000 7:4608000
msm_cpu_max_freq=

# ── 6.15：msm cpu_max_freq 固定上限（借鉴大肥鱼方案）──
# 写入后 chmod 0444 阻止平台/性能服务改写，降低 CPU 上限从而省电；空 = 不管理；
# game_msm_cpu_max_freq 留空 = 游戏中沿用日常值（其方案日常与游戏使用同一 msm 上限）。
# 本机可用档位：policy0(0-5) 最大 3628800，policy6(6-7) 最大 4608000；下列值均为真实档位。
# 日常 2.7456GHz(0-5) / 2.88GHz(6-7)；想更省电可再降，想更高性能可改大或清空。
daily_msm_cpu_max_freq=0:2745600 1:2745600 2:2745600 3:2745600 4:2745600 5:2745600 6:2880000 7:2880000
game_msm_cpu_max_freq=
msm_readonly=1

# 游戏时恢复 IPC 原始档位（避免日常 IPC 上限把游戏频率压住）；1=恢复
game_ipc_restore=1
