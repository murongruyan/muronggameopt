# 游戏场景参数（借鉴「大肥鱼 1+15 调度」的 cfm运行中.sh / cfm结束运行.sh）
# 读取方：bin/activity_game_scenario.inc（game_scenario_tick）
# 仅当 game_packages 中的包名处于前台时应用；退出（切走/退游戏）时恢复进入前的原值。
# 频率单位 kHz；value=0 表示该项不改。改完约 5 秒热重载。

enabled=1

# 逗号分隔的游戏包名（CFM 枪战王者 = com.tencent.tmgp.cf；要加别的游戏直接追加）
game_packages=com.tencent.tmgp.cf

# 调速器（cfm 脚本用 performance；想省电可改 walt/schedutil）
governor=performance

# 第一个策略簇 / 最后一个策略簇的 max/min（源码脚本值：policy0 2745600/384000，policy6 2880000/768000）
game_max_first=2745600
game_min_first=384000
game_max_last=2880000
game_min_last=768000

# background / system-background cpuset（脚本用 0-6）
cpuset_game=0-6

# WALT 上限（脚本用 1497600 / 1555200；本机内核已确认 high_perf 空转、partial_halt 仅暂停窗口，但保持与脚本一致）
walt_high_perf_cap=1497600
walt_partial_halt=1555200

# IPC 档位（脚本：cluster0 全 1497600；cluster1 全 1555200）
ipc_levels_cluster0=1497600 1497600 1497600 1497600 1497600
ipc_levels_cluster1=1555200 1555200 1555200 1555200 1555200

# core_ctl：0=关闭 core_ctl（放开小核热插拔/常驻），进入游戏时写，退出恢复原值
core_ctl_enable=0
